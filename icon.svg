<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background (Squircle for PWA maskable) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
  
  <!-- Graduation Cap & Shield Emblem -->
  <g transform="translate(256, 250) scale(1.1)" filter="url(#glow)">
    <!-- Cap Diamond -->
    <path d="M 0 -85 L 145 -25 L 0 35 L -145 -25 Z" fill="url(#capGrad)" />
    <!-- Cap Skull Base -->
    <path d="M -90 4 L 0 42 L 90 4 L 90 40 C 90 75 0 95 0 95 C 0 95 -90 75 -90 40 Z" fill="#0284c7" />
    <!-- Tassel -->
    <path d="M 120 -15 L 138 25 L 138 70" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="138" cy="74" r="6" fill="#fcd34d"/>
    <!-- Center Vault Lock Dot -->
    <circle cx="0" cy="-25" r="7" fill="#ffffff"/>
  </g>
  
  <!-- Small Star Badge -->
  <polygon points="256,360 264,380 286,380 268,394 274,414 256,400 238,414 244,394 226,380 248,380" fill="#38bdf8" opacity="0.9"/>
</svg>
